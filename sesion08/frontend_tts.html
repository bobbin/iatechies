<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo TTS - Text to Speech (Avanzado)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5rem;
            background: linear-gradient(90deg, #ff6b6b, #feca57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle { text-align: center; color: #888; margin-bottom: 20px; }

        .status-bar {
            display: flex; gap: 15px; margin-bottom: 20px;
            justify-content: center; flex-wrap: wrap;
        }

        .status-item { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .status-dot.ok { background: #00ff88; }
        .status-dot.error { background: #ff4757; }

        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .card h2 { font-size: 1.1rem; margin-bottom: 15px; color: #feca57; }

        textarea {
            width: 100%; min-height: 100px; padding: 12px;
            border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3); color: #fff;
            font-size: 1rem; font-family: inherit; resize: vertical;
        }

        textarea:focus { outline: none; border-color: #feca57; }

        .char-count { text-align: right; font-size: 0.8rem; color: #888; margin: 5px 0; }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .control-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.85rem; color: #aaa; }

        select, input[type="file"] {
            padding: 10px; border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3); color: #fff; font-size: 0.9rem;
        }

        input[type="range"] {
            -webkit-appearance: none; height: 6px;
            background: rgba(255,255,255,0.2); border-radius: 3px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 16px; height: 16px;
            background: #feca57; border-radius: 50%; cursor: pointer;
        }

        .speed-value { text-align: center; font-size: 0.9rem; color: #feca57; }

        .examples { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }

        .example-btn {
            padding: 6px 12px; background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 15px;
            color: #fff; font-size: 0.8rem; cursor: pointer; transition: all 0.2s;
        }

        .example-btn:hover { background: rgba(254,202,87,0.2); border-color: #feca57; }

        .buttons { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 15px; }

        button {
            padding: 12px 25px; border: none; border-radius: 8px;
            font-size: 1rem; font-weight: 600; cursor: pointer;
            transition: all 0.3s; display: flex; align-items: center; gap: 8px;
        }

        button:hover:not(:disabled) { transform: translateY(-2px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-generate { background: linear-gradient(135deg, #ff6b6b, #feca57); color: #1a1a2e; }
        .btn-clear { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-upload { background: rgba(0,217,255,0.2); color: #00d9ff; border: 1px solid #00d9ff; }

        .loading { display: none; text-align: center; padding: 20px; }
        .loading.visible { display: block; }

        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #feca57; border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 10px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .result { display: none; }
        .result.visible { display: block; }

        .audio-player { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; }
        audio { width: 100%; }

        .result-meta {
            display: flex; gap: 20px; justify-content: center;
            flex-wrap: wrap; margin-top: 10px;
        }

        .meta-item { display: flex; flex-direction: column; align-items: center; font-size: 0.85rem; }
        .meta-item .value { font-weight: 600; color: #feca57; }

        .reference-section {
            background: rgba(0,217,255,0.1); border: 1px dashed #00d9ff;
            border-radius: 8px; padding: 15px; margin-top: 10px;
        }

        .reference-section h3 { font-size: 0.95rem; color: #00d9ff; margin-bottom: 10px; }

        .reference-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

        .reference-item {
            background: rgba(0,0,0,0.3); padding: 5px 10px;
            border-radius: 15px; font-size: 0.8rem;
            display: flex; align-items: center; gap: 8px;
        }

        .reference-item button {
            padding: 2px 6px; font-size: 0.7rem;
            background: rgba(255,0,0,0.3); border-radius: 3px;
        }

        .hidden { display: none !important; }

        .model-info {
            font-size: 0.8rem; color: #888; margin-top: 5px;
            padding: 8px; background: rgba(0,0,0,0.2); border-radius: 4px;
        }

        .kokoro-badge {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            padding: 2px 8px; border-radius: 4px; font-size: 0.7rem;
            margin-left: 5px; color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔊 Text to Speech</h1>
        <p class="subtitle">Síntesis de voz avanzada con IA</p>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot" id="statusPyttsx3"></div>
                <span>pyttsx3</span>
            </div>
            <div class="status-item">
                <div class="status-dot" id="statusVits"></div>
                <span>VITS</span>
            </div>
            <div class="status-item">
                <div class="status-dot" id="statusXtts"></div>
                <span>XTTS</span>
            </div>
            <div class="status-item">
                <div class="status-dot" id="statusKokoro"></div>
                <span>Kokoro</span>
            </div>
            <div class="status-item">
                <div class="status-dot" id="statusOpenAI"></div>
                <span>OpenAI</span>
            </div>
        </div>

        <div class="card">
            <h2>📝 Texto</h2>
            <div class="examples">
                <span style="color:#888;font-size:0.85rem;">Ejemplos:</span>
                <button class="example-btn" onclick="setExample(1)">Saludo</button>
                <button class="example-btn" onclick="setExample(2)">Noticia</button>
                <button class="example-btn" onclick="setExample(3)">Tutorial</button>
                <button class="example-btn" onclick="setExample(4)">Cuento</button>
            </div>
            <textarea id="textInput" placeholder="Escribe el texto que quieres convertir a voz..."></textarea>
            <div class="char-count"><span id="charCount">0</span> caracteres</div>
        </div>

        <div class="card">
            <h2>⚙️ Configuración</h2>
            <div class="controls">
                <div class="control-group">
                    <label>Modelo</label>
                    <select id="backend" onchange="updateOptions()">
                        <option value="coqui_vits">🎙️ Coqui VITS (Español)</option>
                        <option value="coqui_xtts">🌍 Coqui XTTS (Multilingüe)</option>
                        <option value="kokoro">🦊 Kokoro TTS (HuggingFace)</option>
                        <option value="pyttsx3">🏠 pyttsx3 (Sistema)</option>
                        <option value="openai">☁️ OpenAI TTS</option>
                    </select>
                </div>

                <div class="control-group" id="languageGroup">
                    <label>Idioma</label>
                    <select id="language">
                        <option value="es">🇪🇸 Español</option>
                        <option value="en">🇬🇧 Inglés</option>
                        <option value="fr">🇫🇷 Francés</option>
                        <option value="de">🇩🇪 Alemán</option>
                        <option value="it">🇮🇹 Italiano</option>
                        <option value="pt">🇵🇹 Portugués</option>
                        <option value="pl">🇵🇱 Polaco</option>
                        <option value="tr">🇹🇷 Turco</option>
                        <option value="ru">🇷🇺 Ruso</option>
                        <option value="zh-cn">🇨🇳 Chino</option>
                        <option value="ja">🇯🇵 Japonés</option>
                        <option value="ko">🇰🇷 Coreano</option>
                        <option value="ar">🇸🇦 Árabe</option>
                        <option value="hi">🇮🇳 Hindi</option>
                    </select>
                </div>

                <div class="control-group" id="speakerGroup">
                    <label>Voz/Speaker</label>
                    <select id="speaker"></select>
                </div>

                <div class="control-group">
                    <label>Velocidad</label>
                    <input type="range" id="speed" min="0.5" max="2.0" step="0.1" value="1.0" oninput="updateSpeed()">
                    <div class="speed-value" id="speedValue">1.0x</div>
                </div>
            </div>

            <div id="modelInfo" class="model-info"></div>

            <!-- Sección de clonación de voz -->
            <div class="reference-section" id="cloningSection">
                <h3>🎭 Clonación de Voz (Opcional)</h3>
                <p style="font-size:0.8rem;color:#aaa;margin-bottom:10px;">
                    Sube un audio de 6-30 segundos para clonar esa voz
                </p>
                <input type="file" id="referenceFile" accept="audio/*" onchange="uploadReference()">
                <div class="reference-list" id="referenceList"></div>
            </div>
        </div>

        <div class="buttons">
            <button class="btn-generate" id="generateBtn" onclick="generate()">
                🎵 Generar Audio
            </button>
            <button class="btn-clear" onclick="clearAll()">
                🗑️ Limpiar
            </button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Generando audio...</p>
        </div>

        <div class="card result" id="result">
            <h2>🎧 Resultado</h2>
            <div class="audio-player">
                <audio id="audioPlayer" controls></audio>
            </div>
            <div class="result-meta">
                <div class="meta-item">
                    <span>Tiempo</span>
                    <span class="value" id="resultTime">-</span>
                </div>
                <div class="meta-item">
                    <span>Tamaño</span>
                    <span class="value" id="resultSize">-</span>
                </div>
                <div class="meta-item">
                    <span>Modelo</span>
                    <span class="value" id="resultModel">-</span>
                </div>
                <div class="meta-item" id="costItem" style="display:none;">
                    <span>Costo</span>
                    <span class="value" id="resultCost">-</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const examples = {
            1: "¡Hola! Bienvenidos a esta demostración de síntesis de voz con inteligencia artificial.",
            2: "Última hora: La inteligencia artificial revoluciona la industria tecnológica con avances sin precedentes.",
            3: "Paso uno: Abre tu editor de código. Paso dos: Escribe el código. Paso tres: Ejecuta y observa los resultados.",
            4: "Había una vez, en un reino digital muy lejano, un pequeño algoritmo que soñaba con aprender a hablar."
        };

        let models = {};
        let selectedReference = null;

        // Inicializar
        document.getElementById('textInput').addEventListener('input', updateCharCount);
        
        // Cargar estado y modelos
        Promise.all([
            fetch('/api/status').then(r => r.json()),
            fetch('/api/models').then(r => r.json())
        ]).then(([status, modelsData]) => {
            // Estado
            document.getElementById('statusPyttsx3').className = 'status-dot ' + (status.pyttsx3 ? 'ok' : 'error');
            document.getElementById('statusVits').className = 'status-dot ' + (status.coqui_vits ? 'ok' : 'error');
            document.getElementById('statusXtts').className = 'status-dot ' + (status.coqui_xtts ? 'ok' : 'error');
            document.getElementById('statusKokoro').className = 'status-dot ' + (status.kokoro ? 'ok' : 'error');
            document.getElementById('statusOpenAI').className = 'status-dot ' + (status.openai ? 'ok' : 'error');
            
            // Modelos
            models = modelsData;
            updateOptions();
            loadReferences();
        });

        function updateOptions() {
            const backend = document.getElementById('backend').value;
            const model = models[backend];
            
            // Actualizar info del modelo
            const infoEl = document.getElementById('modelInfo');
            if (model) {
                infoEl.textContent = model.description;
            }
            
            // Mostrar/ocultar idioma
            const langGroup = document.getElementById('languageGroup');
            if (backend === 'coqui_xtts') {
                langGroup.classList.remove('hidden');
            } else {
                langGroup.classList.add('hidden');
            }
            
            // Actualizar speakers
            const speakerSelect = document.getElementById('speaker');
            const speakerGroup = document.getElementById('speakerGroup');
            speakerSelect.innerHTML = '<option value="default">Por defecto</option>';
            
            if (model && model.speakers && model.speakers.length > 0) {
                speakerGroup.classList.remove('hidden');
                
                // Para Kokoro, usar nombres descriptivos
                if (backend === 'kokoro' && model.speaker_names) {
                    // Agrupar por idioma
                    const spanishVoices = [];
                    const englishVoices = [];
                    const otherVoices = [];
                    
                    model.speakers.forEach(s => {
                        const name = model.speaker_names[s] || s;
                        if (s.startsWith('ef_') || s.startsWith('em_')) {
                            spanishVoices.push({ id: s, name: name });
                        } else if (s.startsWith('af_') || s.startsWith('am_') || s.startsWith('bf_') || s.startsWith('bm_')) {
                            englishVoices.push({ id: s, name: name });
                        } else {
                            otherVoices.push({ id: s, name: name });
                        }
                    });
                    
                    // Añadir voces españolas primero
                    if (spanishVoices.length > 0) {
                        const optgroup = document.createElement('optgroup');
                        optgroup.label = '🇪🇸 Español';
                        spanishVoices.forEach(v => {
                            const opt = document.createElement('option');
                            opt.value = v.id;
                            opt.textContent = v.name;
                            optgroup.appendChild(opt);
                        });
                        speakerSelect.appendChild(optgroup);
                    }
                    
                    // Voces en inglés
                    if (englishVoices.length > 0) {
                        const optgroup = document.createElement('optgroup');
                        optgroup.label = '🇬🇧 Inglés';
                        englishVoices.forEach(v => {
                            const opt = document.createElement('option');
                            opt.value = v.id;
                            opt.textContent = v.name;
                            optgroup.appendChild(opt);
                        });
                        speakerSelect.appendChild(optgroup);
                    }
                    
                    // Otras voces
                    if (otherVoices.length > 0) {
                        const optgroup = document.createElement('optgroup');
                        optgroup.label = '🌍 Otros idiomas';
                        otherVoices.forEach(v => {
                            const opt = document.createElement('option');
                            opt.value = v.id;
                            opt.textContent = v.name;
                            optgroup.appendChild(opt);
                        });
                        speakerSelect.appendChild(optgroup);
                    }
                } else {
                    // Para otros modelos
                    model.speakers.forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = s;
                        opt.textContent = s;
                        speakerSelect.appendChild(opt);
                    });
                }
            } else if (backend === 'openai') {
                speakerGroup.classList.remove('hidden');
                ['alloy', 'echo', 'fable', 'onyx', 'nova', 'shimmer'].forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v;
                    opt.textContent = v.charAt(0).toUpperCase() + v.slice(1);
                    speakerSelect.appendChild(opt);
                });
            } else {
                speakerGroup.classList.add('hidden');
            }
            
            // Mostrar/ocultar clonación
            const cloningSection = document.getElementById('cloningSection');
            if (model && model.supports_cloning) {
                cloningSection.classList.remove('hidden');
            } else {
                cloningSection.classList.add('hidden');
            }
        }

        function updateCharCount() {
            document.getElementById('charCount').textContent = document.getElementById('textInput').value.length;
        }

        function updateSpeed() {
            document.getElementById('speedValue').textContent = document.getElementById('speed').value + 'x';
        }

        function setExample(n) {
            document.getElementById('textInput').value = examples[n];
            updateCharCount();
        }

        async function uploadReference() {
            const file = document.getElementById('referenceFile').files[0];
            if (!file) return;
            
            const formData = new FormData();
            formData.append('audio', file);
            
            try {
                const response = await fetch('/api/upload_reference', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.success) {
                    loadReferences();
                    alert('Audio de referencia subido correctamente');
                } else {
                    alert('Error: ' + data.detail);
                }
            } catch (err) {
                alert('Error al subir: ' + err.message);
            }
            
            document.getElementById('referenceFile').value = '';
        }

        async function loadReferences() {
            try {
                const response = await fetch('/api/references');
                const data = await response.json();
                
                const list = document.getElementById('referenceList');
                list.innerHTML = '';
                
                if (data.references.length === 0) {
                    list.innerHTML = '<span style="color:#666;font-size:0.8rem;">Sin audios de referencia</span>';
                    return;
                }
                
                data.references.forEach(ref => {
                    const item = document.createElement('div');
                    item.className = 'reference-item' + (selectedReference === ref.id ? ' selected' : '');
                    item.innerHTML = `
                        <input type="radio" name="reference" value="${ref.id}" 
                               ${selectedReference === ref.id ? 'checked' : ''}
                               onchange="selectedReference='${ref.id}'">
                        <span>${ref.id} (${ref.size}KB)</span>
                        <button onclick="deleteReference('${ref.id}')">✕</button>
                    `;
                    list.appendChild(item);
                });
                
                // Añadir opción "ninguno"
                const noneItem = document.createElement('div');
                noneItem.className = 'reference-item';
                noneItem.innerHTML = `
                    <input type="radio" name="reference" value="none" 
                           ${!selectedReference ? 'checked' : ''}
                           onchange="selectedReference=null">
                    <span>Sin clonación</span>
                `;
                list.prepend(noneItem);
                
            } catch (err) {
                console.error('Error cargando referencias:', err);
            }
        }

        async function deleteReference(refId) {
            if (!confirm('¿Eliminar este audio de referencia?')) return;
            
            try {
                await fetch(`/api/references/${refId}`, { method: 'DELETE' });
                if (selectedReference === refId) selectedReference = null;
                loadReferences();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        async function generate() {
            const text = document.getElementById('textInput').value.trim();
            if (!text) {
                alert('Escribe algún texto primero');
                return;
            }

            const backend = document.getElementById('backend').value;
            const language = document.getElementById('language').value;
            const speaker = document.getElementById('speaker').value;
            const speed = parseFloat(document.getElementById('speed').value);

            document.getElementById('loading').classList.add('visible');
            document.getElementById('result').classList.remove('visible');

            try {
                const body = {
                    text, backend, speed,
                    language: backend === 'coqui_xtts' ? language : 'es',
                    speaker: speaker,
                    voice: backend === 'openai' ? speaker : 'default',
                    reference_audio: selectedReference || 'none'
                };

                const response = await fetch('/api/synthesize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await response.json();

                if (data.success) {
                    document.getElementById('audioPlayer').src = data.audio_url;
                    document.getElementById('resultTime').textContent = data.processing_time + 's';
                    document.getElementById('resultSize').textContent = data.file_size + ' KB';
                    document.getElementById('resultModel').textContent = backend;
                    
                    if (data.cost !== null) {
                        document.getElementById('costItem').style.display = 'flex';
                        document.getElementById('resultCost').textContent = '$' + data.cost;
                    } else {
                        document.getElementById('costItem').style.display = 'none';
                    }

                    document.getElementById('result').classList.add('visible');
                } else {
                    alert('Error: ' + (data.detail || 'Error desconocido'));
                }

            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                document.getElementById('loading').classList.remove('visible');
            }
        }

        function clearAll() {
            document.getElementById('textInput').value = '';
            document.getElementById('result').classList.remove('visible');
            selectedReference = null;
            loadReferences();
            updateCharCount();
        }
    </script>
</body>
</html>
